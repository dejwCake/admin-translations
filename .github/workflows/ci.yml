name: CI

on:
  push:
  pull_request:

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist --ignore-platform-req=ext-gd
      - run: phpcs -s --extensions=php

  phpcs-compatibility:
    name: PHPCS Compatibility
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist --ignore-platform-req=ext-gd
      - run: phpcs --standard=.phpcs.compatibility.xml --cache=.phpcs.cache

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist --ignore-platform-req=ext-gd
      - run: phpstan analyse --configuration=phpstan.neon

  phpmd:
    name: PHPMD
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist --ignore-platform-req=ext-gd
      - run: |
          status=0
          phpmd analyze --no-progress --format=github > phpmd-github.txt || status=$?
          sed "s#file=$GITHUB_WORKSPACE/#file=#" phpmd-github.txt
          exit $status

  tests:
    name: Tests (${{ matrix.db }})
    needs: [phpcs, phpcs-compatibility, phpstan, phpmd]
    runs-on: ubuntu-latest
    strategy:
      # Report both databases even when one fails.
      fail-fast: false
      matrix:
        include:
          - db: pgsql
            port: 5432
          - db: mariadb
            port: 3306
    container:
      image: dejwcake/php8.5:1
      env:
        DB_CONNECTION: ${{ matrix.db }}
        DB_HOST: ${{ matrix.db }}
        DB_PORT: ${{ matrix.port }}
        DB_DATABASE: laravel
        DB_USERNAME: laravel
        DB_PASSWORD: bestsecret
    services:
      pgsql:
        image: dejwcake/postgres18:1
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: bestsecret
          PGPASSWORD: bestsecret
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U laravel -d laravel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mariadb:
        image: dejwcake/mariadb12.3:1
        env:
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: bestsecret
          MYSQL_ROOT_PASSWORD: bestsecret
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u laravel -pbestsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist
      - if: matrix.db != 'pgsql'
        run: vendor/bin/phpunit
      - if: matrix.db == 'pgsql'
        run: |
          vendor/bin/phpunit --coverage-text=coverage.txt
          cat coverage.txt
          { echo '### Coverage (pgsql)'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
